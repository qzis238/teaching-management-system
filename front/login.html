<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教学数字平台管理系统</title>
  <!-- Element Plus CSS -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #4facfe 0%, #f093fb 100%);
      font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    .login-card {
      width: 420px;
      padding: 40px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-title {
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 8px;
    }
    .login-subtitle {
      text-align: center;
      font-size: 14px;
      color: #909399;
      margin-bottom: 32px;
    }
    .login-btn {
      width: 100%;
      height: 42px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="login-card">
      <div class="login-title">教学数字平台</div>
      <div class="login-subtitle">管理系统</div>
      <el-form ref="formRef" :model="form" :rules="rules" label-position="top" @keyup.enter="handleLogin">
        <el-form-item label="用户名" prop="username">
          <el-input v-model="form.username" placeholder="请输入用户名" size="large" clearable></el-input>
        </el-form-item>
        <el-form-item label="密码" prop="password">
          <el-input v-model="form.password" type="password" placeholder="请输入密码" size="large" show-password clearable></el-input>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" class="login-btn" :loading="loading" @click="handleLogin">登 录</el-button>
        </el-form-item>
      </el-form>
      <div style="text-align:center;color:#C0C4CC;font-size:12px;">测试账号：admin / admin123</div>
    </div>
  </div>

  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <!-- Element Plus -->
  <script src="https://unpkg.com/element-plus"></script>
  <!-- Element Plus 中文语言包 -->
  <script src="https://unpkg.com/element-plus/dist/locale/zh-cn.min.js"></script>

  <script>
    const { createApp, ref, reactive } = Vue

    const app = createApp({
      setup() {
        const formRef = ref(null)
        const loading = ref(false)
        const form = reactive({
          username: '',
          password: ''
        })

        const rules = {
          username: [
            { required: true, message: '请输入用户名', trigger: 'blur' }
          ],
          password: [
            { required: true, message: '请输入密码', trigger: 'blur' }
          ]
        }

        const API_BASE = 'http://localhost:8080'

        const handleLogin = async () => {
          const valid = await formRef.value.validate().catch(() => false)
          if (!valid) return

          loading.value = true
          try {
            const response = await fetch(API_BASE + '/api/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username: form.username, password: form.password })
            })
            const result = await response.json()
            if (result.code === 200) {
              localStorage.setItem('token', result.data.token)
              localStorage.setItem('userInfo', JSON.stringify({
                userId: result.data.userId,
                username: result.data.username,
                realName: result.data.realName,
                role: result.data.role
              }))
              ElementPlus.ElMessage.success('登录成功')
              window.location.href = 'index.html'
            } else {
              ElementPlus.ElMessage.error(result.message || '登录失败')
            }
          } catch (e) {
            ElementPlus.ElMessage.error('网络错误，请检查后端服务是否启动')
          }
          loading.value = false
        }

        return { formRef, form, rules, loading, handleLogin }
      }
    })

    app.use(ElementPlus, { locale: ElementPlusLocaleZhCn })
    app.mount('#app')
  </script>
</body>
</html>
